name: Process Due NutriSnap Reminders

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  process-reminders:
    name: Trigger /api/notifications/process-reminders
    runs-on: ubuntu-latest
    steps:
      - name: Invoke Backend Reminder Processor
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          NUTRISNAP_APP_URL: ${{ vars.NUTRISNAP_APP_URL || 'https://www.nutrisnap.co.in' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET secret is not set in repository secrets; skipping remote trigger."
            exit 0
          fi
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            "${NUTRISNAP_APP_URL}/api/notifications/process-reminders"
